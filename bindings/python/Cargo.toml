[package]
name = "mpatch_py"
version = "1.8.1"
edition = "2021"
description = "A smart, context-aware patch tool that applies diffs using fuzzy matching, ideal for AI-generated code."
authors = ["Romelium <author@romelium.com>"]
repository = "https://github.com/romelium/mpatch"
license = "MIT"
publish = false

[lib]
name = "mpatch" # This is the name Python will use: `import mpatch`
crate-type = ["cdylib"]

[dependencies]
mpatch = { path = "../../", default-features = false, features = ["parallel"] }
# abi3-py38: one wheel for GIL-enabled CPython 3.8 to 3.14.
# abi3t-py315: one wheel for both GIL-enabled and free-threaded CPython 3.15+ (PEP 803).
# Free-threaded 3.14 has no stable ABI, so it gets a version-specific build.
pyo3 = { version = "0.29.3", features = ["abi3-py38", "abi3t-py315", "extension-module"] }
