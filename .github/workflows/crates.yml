name: Publish Rust Crate to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: Upload release to crates.io
    runs-on: ubuntu-latest

    environment:
      name: crates-io
      url: https://crates.io/crates/mpatch

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          cache: false

      # Refuse to publish if the release tag and the crate version disagree.
      - name: Check Tag Matches Crate Version
        if: github.event_name == 'release'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mpatch") | .version')
          if [[ "${REF_NAME#v}" != "$CRATE_VERSION" ]]; then
            echo "Error: Tag '$REF_NAME' does not match crate version '$CRATE_VERSION'"
            exit 1
          fi

      # Trusted Publishing: exchanges the workflow's OIDC token for a short-lived
      # crates.io token, so no long-lived CARGO_REGISTRY_TOKEN secret is needed.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish -p mpatch --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
