name: Publish Python Bindings to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build ${{ matrix.abi.name }} wheels on ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # PyO3's `abi3-py38` and `abi3t-py315` features pick the ABI from the target interpreter:
        # - abi3:   GIL-enabled CPython 3.8 to 3.14
        # - cp314t: free-threaded CPython 3.14, which has no stable ABI
        # - abi3t:  GIL-enabled and free-threaded CPython 3.15+ (PEP 803)
        abi:
          - { name: abi3 }
          - { name: cp314t, python: '3.14t' }
          - { name: abi3t, python: '3.15' }
        platform:
          # --- Linux ---
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          # --- macOS ---
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: universal2-apple-darwin }
          # --- Windows ---
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Setup Python
        if: matrix.abi.python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.abi.python }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ contains(matrix.platform.target, 'linux-musl') && 'musllinux_1_2' || '2_17' }}
          working-directory: bindings/python
          # Without `-i`, maturin builds the abi3 wheel. `-i` selects the cp314t or abi3t build;
          # a target with no matching interpreter (e.g. Windows ARM64) uses maturin's bundled sysconfig.
          args: --release --out dist --locked --compatibility pypi ${{ matrix.abi.python && format('-i python{0}', matrix.abi.python) || '' }}
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          # Use dynamic artifact names to prevent overwriting between parallel jobs for the same target
          name: wheels-${{ matrix.platform.target }}-${{ matrix.abi.name }}
          path: bindings/python/dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  publish-pypi:
    name: Upload release to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    
    environment:
      name: pypi
      url: https://pypi.org/p/mpatch
      
    permissions:
      id-token: write
      contents: read
      
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sdist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1